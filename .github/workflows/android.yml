
name: Build DodgeMaster APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DodgeMasterAndroid_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q DodgeMasterAndroid_Project.zip -d android-project

      - name: Build APK
        run: |
          PROJECT_FILE=$(find android-project -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DodgeMaster-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          
